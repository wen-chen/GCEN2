# R environment of the WGCNA, hdWGCNA, DGCA and RandomWalkRestartMH
# benchmarks (the versions the published comparisons used; R 4.4.3,
# Bioconductor 3.20).
#
#   conda env create -f benchmarks/environment-r.yml
#   conda activate gcen2-bench-r
#   Rscript -e 'remotes::install_github("smorabit/hdWGCNA@v0.4.12", dependencies = FALSE, upgrade = "never")'
#   Rscript -e 'remotes::install_url("https://cran.r-project.org/src/contrib/Archive/DGCA/DGCA_1.0.3.tar.gz", dependencies = FALSE, upgrade = "never")'
#   Rscript -e 'remotes::install_github("alberto-valdeolivas/RandomWalkRestartMH@3d61974c49ad7cd954c86d65a263b52a44d50497", dependencies = FALSE, upgrade = "never")'
#   export RSCRIPT=$(command -v Rscript)        # used by the run_*.sh scripts
#
# Not on conda, installed with all their dependencies (below) already in the
# environment: hdWGCNA 0.4.12 from its GitHub tag; DGCA 1.0.3 from the CRAN
# archive (removed from CRAN on 2024-05-04); RandomWalkRestartMH 1.13.2 from
# GitHub (no longer in the current Bioconductor release).
name: gcen2-bench-r
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.4.3
  # WGCNA and its tree cut / clustering
  - r-wgcna=1.74
  - r-dynamictreecut=1.63_1
  - r-fastcluster=1.3.0
  # Seurat and the other dependencies of hdWGCNA 0.4.12
  - r-seurat=5.5.1
  - r-seuratobject=5.4.0
  - r-harmony=2.0.5
  - r-matrix=1.7_6
  - r-igraph=2.3.4
  - r-enrichr=3.4
  - r-ggplot2=4.0.3
  - r-dplyr=1.2.1
  - r-tester=0.3.0
  - r-proxy=0.4_29
  - r-ggrepel=0.9.8
  - r-ggraph=2.2.2
  - r-tidygraph=1.3.0
  - bioconductor-ucell=2.10.1
  - bioconductor-geneoverlap=1.42.0
  - bioconductor-genomicranges=1.58.0
  - bioconductor-summarizedexperiment=1.36.0
  # used by the benchmark scripts
  - r-hdf5r=1.3.16
  - r-hmisc=5.3_0
  - r-data.table=1.18.6.1
  - r-jsonlite=2.0.0
  - r-remotes=2.5.0
  # DGCA 1.0.3 (WGCNA above)
  - r-matrixstats=1.5.0
