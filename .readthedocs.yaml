# Read the Docs configuration (https://docs.readthedocs.io/en/stable/config-file/v2.html).
# The documentation builds from the sources without the compiled extension
# (docs/conf.py puts the repository on sys.path; optional libraries are mocked).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
