[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "gcen2"
version = "2.0.0.dev0"
description = "A Python Toolkit for Gene Co-Expression Network Analysis with Single-Cell Resolution and Interactive Visualization"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Wen Harold Chen", email = "chenwen@biochen.org" },
]
keywords = [
    "bioinformatics",
    "gene co-expression network",
    "single-cell",
    "RNA-seq",
    "network analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.9"
# Lower bounds: the oldest versions the test suite was run with (Python 3.9,
# numpy 1.24, pandas 2.0, scipy 1.10, anndata 0.10, matplotlib 3.7, typer 0.9);
# also tested up to Python 3.14 with numpy 2.5, pandas 3.1, anndata 0.13.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "threadpoolctl>=3.0",
    "typer>=0.9",       # the gcen2 command
]

[project.optional-dependencies]
single-cell = [
    "anndata>=0.10",
    "scanpy>=1.9",
]
visualization = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyvis>=0.3",
    "networkx>=3.1",
]
report = [
    "Jinja2>=3.1",
    "weasyprint",
]
cli = []  # typer is a core dependency now; kept so that gcen2[cli] still installs
all = [
    "gcen2[single-cell,visualization,report,cli]",
]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=4.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "ruff>=0.1",
    "pre-commit>=3.0",
    "gcen2[all]",
]

[project.scripts]
gcen2 = "gcen2.cli:app"

[project.urls]
Homepage = "https://www.biochen.org/gcen2/"
Repository = "https://github.com/wen-chen/GCEN2"
Issues = "https://github.com/wen-chen/GCEN2/issues"

[tool.scikit-build]
cmake.build-type = "Release"
build.verbose = false
build-dir = "build"
wheel.packages = ["gcen2"]
# data/* is gitignored except data/example, which the tests need; scikit-build-core
# does not follow the negated .gitignore pattern, so it is included here
sdist.include = ["data/example"]
install.components = ["python"]
editable.mode = "redirect"
editable.rebuild = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks tests as benchmarks",
    "integration: marks tests as integration tests",
    "requires_single_cell: marks tests that need anndata/scanpy",
    "requires_visualization: marks tests that need matplotlib",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",            # long lines: 100 characters is a guide, not a rule
    "N803", "N806",    # matrices named as in the maths (X, W, F, ...)
    "N812",            # e.g. import scipy.sparse as sp ... as conventional names
    "E741",            # I for Moran's I, l for a list of lines
    "B008",            # typer: typer.Option(...) as the argument default is the API
    "UP007", "UP045",  # typer evaluates CLI annotations: X | None fails on Python 3.9
    "C408",            # dict(a=1) reads better than {"a": 1} for keyword-like options
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "F811",  # pytest fixtures used as arguments
    "E402",  # imports after pytest.importorskip
]

[tool.ruff.lint.isort]
known-first-party = ["gcen2"]

[tool.coverage.run]
source = ["gcen2"]
omit = ["gcen2/core/*"]  # C++ extension coverage handled separately

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
